name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Privacy check
        run: python3 scripts/privacy-check.py

      - name: Release build
        run: bash scripts/build.sh

      - name: Packaged app checks
        run: '"dist/LG TV Remote.app/Contents/MacOS/LGRemote" --self-check'
